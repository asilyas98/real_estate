workflows:
  ios-production:
    name: iOS — App Store (production)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - expo_credentials
      node: 22.11.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Set up EAS CLI
        script: npm install -g eas-cli

      - name: Verify Expo auth
        script: eas whoami

      - name: Diagnose Expo config
        script: |
          EXPO_DEBUG=1 npx expo config --json > /tmp/expo-config.json

      - name: EAS build — iOS production
        script: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --no-wait

    publishing:
      email:
        recipients:
          - asilyas988@gmail.com
        notify:
          success: true
          failure: true