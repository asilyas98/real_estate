workflows:

  # ─────────────────────────────────────────────────────────────
  # iOS App Store build + submit  (triggers on: master)
  # ─────────────────────────────────────────────────────────────
  ios-production:
    name: iOS — App Store (production)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - expo_credentials   # add EXPO_TOKEN here in Codemagic UI
      node: 20.11.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Set up EAS CLI
        script: |
          npm install -g eas-cli

      - name: EAS build — iOS production
        script: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --no-wait

      - name: EAS submit — App Store Connect
        script: |
          eas submit \
            --platform ios \
            --profile production \
            --non-interactive

    artifacts:
      - build/**/*.ipa

    publishing:
      email:
        recipients:
          - asilyas98@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────
  # iOS TestFlight preview build  (triggers on: develop)
  # ─────────────────────────────────────────────────────────────
  ios-preview:
    name: iOS — TestFlight (preview)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - expo_credentials
      node: 20.11.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Set up EAS CLI
        script: |
          npm install -g eas-cli

      - name: EAS build — iOS preview
        script: |
          eas build \
            --platform ios \
            --profile preview \
            --non-interactive \
            --no-wait

    artifacts:
      - build/**/*.ipa

    publishing:
      email:
        recipients:
          - asilyas98@gmail.com
        notify:
          success: true
          failure: true