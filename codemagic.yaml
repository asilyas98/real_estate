workflows:
  ios-production:
    name: iOS — App Store (production)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
      vars:
        EXPO_TOKEN: $EXPO_TOKEN

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Set up EAS CLI
        script: npm install -g eas-cli

      - name: Verify Expo auth
        script: |
          echo "EXPO_TOKEN length: ${#EXPO_TOKEN}"
          eas whoami

      - name: EAS build — iOS production
        script: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --no-wait

    publishing:
      email:
        recipients:
          - asilyas98@gmail.com
        notify:
          success: true
          failure: true